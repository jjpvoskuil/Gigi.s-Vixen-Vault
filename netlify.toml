# FALLBACK ONLY (since 2026-11-10 the app is on GitHub Pages — .github/workflows/pages.yml). Netlify builds web/ on push.
[build]
  base = "web"
  command = "npm ci && npm test && npm run build"
  publish = "dist"
  # skip the build when nothing under web/ changed (Streamlit-only pushes)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera stays allowed: she photographs clothes in the app
    Permissions-Policy = "geolocation=(), camera=(self), microphone=()"
